name: Website Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "rebuild/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production dependency vulnerability audit
        run: pnpm audit --prod --audit-level high
      - name: Full dependency audit (development advisory review)
        run: pnpm audit --audit-level high
        continue-on-error: true
      - name: TypeScript check
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
